<!doctype html><html lang="ca"><meta charset="utf-8"><title>Obrador · prova</title>
<script type="module">
// Obre la web real amb un servidor simulat i dades inventades. Correu a@prova.test, contrasenya prova-12345.
const uid = '00000000-0000-4000-8000-000000000001', files = new Map(), real = window.fetch.bind(window);
const posa = (c, id, dades) => files.set(c + '/' + id, { coleccio: c, id, dades, versio: 1 });
posa('obres', 'o1', { codi: '10001', nom: 'Obra de prova', estat: 'En execució' });
posa('parts', 'rc-1', { data: '2026-01-02', obraId: 'o1', treballador: 'Persona de prova', ofici: 'Peó', hores: 8, preuHora: 20, dietes: 10, desplacament: 5, origen: 'RECOPAPP' });
window.FILES = files; window.CRIDES = []; window.ROL = 'edicio';
const js = (d, s = 200) => new Response(JSON.stringify(d), { status: s });
const tk = () => 'x.' + btoa(JSON.stringify({ sub: uid })) + '.y';
window.fetch = async (u, o = {}) => {
  const url = new URL(u, location.href); if (url.host !== 'prova.test') return real(u, o);
  const m = o.method || 'GET', p = url.pathname, b = typeof o.body === 'string' ? JSON.parse(o.body) : null, g = (k) => url.searchParams.get(k);
  window.CRIDES.push(m + ' ' + p);
  if (p === '/auth/v1/token') return b.refresh_token || b.password === 'prova-12345' ? js({ access_token: tk(), refresh_token: 'r', expires_in: 3600 }) : js({ msg: 'no' }, 400);
  if (p.startsWith('/auth/')) return js({});
  if (p.endsWith('obrador_membres')) return js([{ user_id: uid, nom: 'Prova Admin', rol: window.ROL }]);
  if (p.endsWith('obrador_empremta')) return js([...files.values()].map((x) => x.id + x.versio).join());
  if (p.startsWith('/storage/v1/object/sign')) return js(b.paths.map((x) => ({ path: x, signedURL: '/object/sign/obrador/' + x + '?token=t' })));
  if (p.startsWith('/storage/')) return js({});
  if (p.endsWith('obrador_docs')) {
    if (m === 'GET') return js([...files.values()]);
    if (m === 'POST') { const x = { ...b, versio: 1 }; files.set(b.coleccio + '/' + b.id, x); return js([x], 201); }
    const k = g('coleccio').slice(3) + '/' + g('id').slice(3), x = files.get(k);
    if (!x || (g('versio') && g('versio') !== 'eq.' + x.versio)) return js([]);
    if (m === 'DELETE') { files.delete(k); return js([x]); }
    const n = { ...x, dades: b.dades, versio: x.versio + 1 }; files.set(k, n); return js([n]);
  }
  return js({}, 404);
};
let h = await (await real('../public/index.html', { cache: 'no-store' })).text();
h = h.replace('<head>', '<head><base href="../public/">').replace('<script src="config.js?v=2"></' + 'script>', '<script>window.OBRADOR_CONFIG={url:"https://prova.test",clauPublica:"k"}</' + 'script>');
document.open(); document.write(h); document.close();
</script></html>
