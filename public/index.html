<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Obrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dark site-hut sidebar (modules) + concrete-grey work surface; drawers slide in from the right for records and documents. */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --sunk:#E2E6E9; --ink:#15202B; --muted:#58646F; --line:#D2D8DD;
  --side:#16202A; --side-ink:#CBD4DC; --side-mut:#7E8B97; --side-hi:#223140;
  --accent:#E8A200; --accent-ink:#1A1300; --link:#1F5C99;
  --ok:#2D7A4C; --warn:#9A6210; --bad:#B53A2E; --info:#2B67A8; --neu:#66717C;
  --shadow:0 10px 30px rgba(18,28,38,.18);
  --f-disp:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#192027; --sunk:#141A20; --ink:#E4E9ED; --muted:#98A4AF; --line:#2B353F;
  --side:#0C1116; --side-ink:#C5CED6; --side-mut:#74818D; --side-hi:#1B2631;
  --accent:#F2B230; --accent-ink:#1A1300; --link:#82B4E6;
  --ok:#5DBF88; --warn:#E3AE55; --bad:#EE7D70; --info:#80B3E8; --neu:#94A0AB;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#192027; --sunk:#141A20; --ink:#E4E9ED; --muted:#98A4AF; --line:#2B353F;
  --side:#0C1116; --side-ink:#C5CED6; --side-mut:#74818D; --side-hi:#1B2631;
  --accent:#F2B230; --accent-ink:#1A1300; --link:#82B4E6;
  --ok:#5DBF88; --warn:#E3AE55; --bad:#EE7D70; --info:#80B3E8; --neu:#94A0AB;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px)}
.hazard{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--side) 10px 20px)}
.brand{padding:18px 18px 14px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-disp);font-stretch:112%;font-weight:800;font-size:22px;letter-spacing:.02em;color:#fff}
.brand span{font-size:11px;color:var(--side-mut);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;overflow-y:auto;flex:1}
.nav h6{margin:14px 8px 4px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--side-mut)}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;color:var(--side-ink);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--side-hi)}
.nav a.on{background:var(--side-hi);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;opacity:.85}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;font-family:var(--f-mono)}
.who{padding:12px 16px 16px;border-top:1px solid var(--side-hi);display:flex;align-items:center;gap:10px;font-size:12.5px}
.who img{width:28px;height:28px;border-radius:50%}
.who small{display:block;color:var(--side-mut)}

.main{min-width:0;padding-block:22px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));padding:10px 14px;border-radius:var(--r);margin-bottom:16px}
.banner p{margin:0;flex:1;min-width:200px}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-family:var(--f-disp);font-stretch:105%;font-weight:750;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.head .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.head .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:5px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--surface)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.kpi .v{font-family:var(--f-disp);font-weight:700;font-size:26px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>h2{font-family:var(--f-disp);font-size:15px;font-weight:700;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel>h2 .sp{flex:1}
.panel .pb{padding:12px 16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input[type=search],.tools select{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 10px;min-width:0}
.tools input[type=search]{width:240px;max-width:100%}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel .tw{border:0;border-radius:0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
tbody tr:last-child td{border-bottom:0}
td.t-main{font-weight:500;min-width:160px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap;color:var(--tone);background:color-mix(in srgb,var(--tone) 14%,transparent)}
.t-ok{--tone:var(--ok)}.t-warn{--tone:var(--warn)}.t-bad{--tone:var(--bad)}.t-info{--tone:var(--info)}.t-neu{--tone:var(--neu)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.c i{background:var(--warn)}
.bar.over i{background:var(--bad)}
.prog{display:flex;align-items:center;gap:8px}
.prog span{font-size:12px;width:34px;text-align:right}
.code{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}

.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent)}
.col>header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px;font-size:12.5px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--muted)}
.card .m{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}

.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.alist li:last-child{border-bottom:0}
.alist li:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.alist .dot{width:8px;height:8px;border-radius:50%;background:var(--tone);margin-top:6px;flex:none}
.alist .tx{flex:1;min-width:0}
.alist small{display:block;color:var(--muted);font-size:12px}
.feed li{cursor:default}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

.docs{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;font-size:13px;max-height:calc(100vh - 160px);overflow:auto;position:sticky;top:12px}
.tree details>summary{list-style:none;cursor:pointer;padding:5px 6px;border-radius:4px;font-weight:600;display:flex;gap:6px;align-items:center}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary::before{content:'▸';font-size:10px;color:var(--muted);width:10px}
.tree details[open]>summary::before{content:'▾'}
.tree .f{display:flex;gap:6px;align-items:center;padding:4px 6px 4px 22px;border-radius:4px;cursor:pointer;color:var(--ink)}
.tree .f:hover{background:var(--sunk)}
.tree .f.on{background:color-mix(in srgb,var(--accent) 20%,transparent);font-weight:600}
.tree .f i{font-style:normal;margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tree .root{padding-left:8px;font-weight:600}
.crumb{font-size:13px;color:var(--muted);margin-bottom:2px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;color:var(--muted);margin-bottom:12px;font-size:13px}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.ficon{display:inline-grid;place-items:center;width:30px;height:22px;border-radius:3px;font-family:var(--f-mono);font-size:9.5px;font-weight:600;color:#fff;background:var(--neu);margin-right:8px;vertical-align:middle;flex:none}
.ficon.pdf{background:#B53A2E}.ficon.img{background:#2D7A4C}.ficon.vid{background:#6B4FA8}.ficon.dat{background:#2B67A8}

.scrim{position:fixed;inset:0;background:rgba(10,16,22,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer>header{display:flex;align-items:center;gap:10px;padding:14px 18px;padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.drawer>header h3{margin:0;font-family:var(--f-disp);font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.drawer .body{padding:16px 18px;padding-right:max(18px,env(safe-area-inset-right,0px));overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer>footer{display:flex;gap:8px;padding:12px 18px;padding-right:max(18px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.drawer>footer .sp{flex:1}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:4px 8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.w{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{min-height:80px;resize:vertical}
.calc{background:var(--sunk);border-radius:5px;padding:10px 12px;font-size:13px;display:grid;grid-template-columns:1fr auto;gap:2px 16px}
.calc b{font-family:var(--f-mono)}
.vers{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:5px}
.vers li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.vers li:last-child{border-bottom:0}
.vers .tx{flex:1;min-width:140px}
.prev{background:var(--sunk);border-radius:5px;display:grid;place-items:center;min-height:120px;overflow:hidden}
.prev img,.prev video{max-width:100%;max-height:320px;display:block}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.meta dt{color:var(--muted)}
.meta dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:5px;z-index:60;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding-left:0}
  .brand{flex-direction:row;align-items:baseline;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) 6px}
  .nav{flex-direction:row;overflow-x:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 10px}
  .nav h6{display:none}
  .nav a.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .who{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 50px}
  .docs{grid-template-columns:minmax(0,1fr)}
  .tree{position:static;max-height:260px}
  .head h1{font-size:23px}
}
@media (max-width:480px){.kpis{grid-template-columns:minmax(0,1fr)}.fgrid{grid-template-columns:minmax(0,1fr)}.tools input[type=search]{width:100%}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<div class="app">
  <aside class="side">
    <div class="hazard"></div>
    <div class="brand"><b>OBRADOR</b><span>Gestió d'obra i documents</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main class="main" id="view"><div class="loading">Carregant l'Obrador…</div></main>
</div>
<div id="drawerHost"></div>
<div id="toastHost"></div>

<script>
/* ---------- Constants & schema ---------- */
const OBRA_ESTATS=['Licitació','Preparació','En execució','Aturada','Recepció provisional','Tancada'];
const FASES=['Implantació','Moviment de terres','Fonamentació','Estructura','Tancaments','Coberta','Instal·lacions','Acabats','Urbanització'];
const CARP_OBRA=['01 Projecte i plànols','02 Contracte i pressupost','03 Certificacions','04 Seguretat i salut','05 Qualitat i assajos','06 Fotografies d\'obra','07 Actes i correspondència','08 Final d\'obra'];
const CARP_EMP=['Plantilles','Qualitat ISO 9001','Prevenció de riscos','Administració','Maquinària: fitxes i ITV'];
const DOC_ESTATS=['Esborrany','En revisió','Aprovat','Obsolet'];
const TONE={'Licitació':'info','Preparació':'neu','En execució':'ok','Aturada':'bad','Recepció provisional':'warn','Tancada':'neu',
 'Pendent':'warn','En curs':'info','Bloquejada':'bad','Feta':'ok','Detectada':'neu','En estudi':'info','Ofertada':'warn','Adjudicada':'ok','Perduda':'bad',
 'Esborrany':'neu','Sol·licitada':'info','Aprovada':'ok','Rebuda':'ok','Cancel·lada':'bad','Cobrada':'ok','Pagada':'ok','Vençuda':'bad',
 'Disponible':'ok','En obra':'info','En reparació':'warn','Baixa':'bad','En revisió':'warn','Aprovat':'ok','Obsolet':'bad','Alta':'bad','Normal':'neu','Baixa ':'neu'};
const M={
 obres:{t:'Obres',s:'obra',pref:'OB',tit:'nom',camps:[
  {k:'codi',l:'Codi',tp:'code',req:1},{k:'nom',l:"Nom de l'obra",tp:'text',req:1,w:1},
  {k:'client',l:'Client / promotor',tp:'text'},{k:'ubicacio',l:'Ubicació',tp:'text'},
  {k:'tipus',l:'Tipologia',tp:'sel',o:['Obra nova residencial','Rehabilitació','Façanes','Industrial','Equipament públic','Obra civil']},
  {k:'estat',l:'Estat',tp:'sel',o:OBRA_ESTATS},{k:'cap',l:"Cap d'obra",tp:'text'},{k:'superficie',l:'Superfície (m²)',tp:'num'},
  {k:'inici',l:'Inici',tp:'date'},{k:'fi',l:'Fi prevista',tp:'date'},
  {k:'pressupost',l:'Import contracte (PEC, sense IVA)',tp:'money'}],
  cols:['codi','nom','client','estat',{l:'Avanç',f:o=>avancHtml(o.id)},'pressupost',{l:'Cost real',num:1,f:o=>fmtM(fin(o.id).cost)}]},
 tasques:{t:'Planificació',s:'tasca',tit:'titol',kanban:1,camps:[
  {k:'titol',l:'Tasca',tp:'text',req:1,w:1},{k:'obraId',l:'Obra',tp:'obra'},{k:'fase',l:'Fase',tp:'sel',o:FASES},
  {k:'estat',l:'Estat',tp:'sel',o:['Pendent','En curs','Bloquejada','Feta']},{k:'prioritat',l:'Prioritat',tp:'sel',o:['Normal','Alta','Baixa ']},
  {k:'responsable',l:'Responsable',tp:'text'},{k:'limit',l:'Data límit',tp:'date'},{k:'notes',l:'Notes',tp:'area',w:1}],
  cols:['titol','obraId','fase','responsable','limit','prioritat','estat']},
 oportunitats:{t:'Licitacions',s:'oportunitat',tit:'nom',kanban:1,camps:[
  {k:'nom',l:'Licitació / projecte',tp:'text',req:1,w:1},{k:'client',l:'Client',tp:'text'},
  {k:'tipus',l:'Tipologia',tp:'sel',o:['Obra nova residencial','Rehabilitació','Façanes','Industrial','Equipament públic','Obra civil']},
  {k:'estat',l:'Estat',tp:'sel',o:['Detectada','En estudi','Ofertada','Adjudicada','Perduda']},
  {k:'import',l:'Import ofertat (sense IVA)',tp:'money'},{k:'probabilitat',l:'Probabilitat (%)',tp:'pct'},
  {k:'presentacio',l:"Data de presentació",tp:'date'},{k:'notes',l:'Notes',tp:'area',w:1}],
  cols:['nom','client','tipus','presentacio','import','probabilitat','estat']},
 comandes:{t:'Compres',s:'comanda',pref:'CP',tit:'concepte',kanban:1,camps:[

const fmtDT=t=>{if(!t)return'—';const d=new Date(t);return isNaN(d)?'—':d.toLocaleDateString('ca-ES',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'})};
const fmtSize=b=>!b?'—':b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' kB':(b/1048576).toFixed(1)+' MB';

function totF(f){const b=+f.base||0;const r=String(f.iva||'').startsWith('ISP')?0:(parseFloat(f.iva)||0)/100;const iva=b*r;const ret=b*((+f.retencio||0)/100);return{base:b,iva,ret,total:b+iva-ret}}

/* ---------- Store layer ---------- */
async function save(col,id,obj){
  const body={...obj,actualitzat:new Date().toISOString(),actualitzatPer:ME&&ME.id||null};
  delete body.id;
  if(LOCAL){const a=S[col];const i=a.findIndex(x=>x.id===id);const r={...body,id};if(i>=0)a[i]=r;else a.push(r);schedule();return}
  try{await DB.collection(col).doc(id).set(body)}catch(e){handleErr(e);throw e}
}
async function remove(col,id){
  if(LOCAL){S[col]=S[col].filter(x=>x.id!==id);schedule();return}
  try{await DB.collection(col).doc(id).delete()}catch(e){handleErr(e);throw e}
}
function handleErr(e){
  const c=e&&e.code;
  if(c==='conflicte')toast("Una altra persona ha canviat aquest registre. S'ha recarregat: revisa'l i torna-ho a provar.");
  else if(c==='invalid_argument'){CANWRITE=false;toast('No tens permís per modificar dades en aquest Obrador. Demana accés de col·laborador.');schedule()}
  else if(c==='quota_exceeded')toast("S'ha arribat al límit d'emmagatzematge. Elimina registres antics per continuar.");
  else if(c==='resource_exhausted')toast('Massa operacions seguides. Espera uns segons i torna-ho a provar.');
  else toast('No s\'ha pogut desar. Comprova la connexió i torna-ho a provar.');
}

/* ---------- Render loop ---------- */
let raf=0;function schedule(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;paint()})}
const needIds=new Set();
function paint(){
  needIds.clear();
  const r=route();
  $('#nav').innerHTML=navHtml(r);
  const ae=document.activeElement,aid=ae&&ae.id&&$('#view').contains(ae)?ae.id:null,ss=aid&&ae.selectionStart;
  $('#view').innerHTML=bannerHtml()+viewHtml(r);
  if(aid){const n=document.getElementById(aid);if(n){n.focus();try{if(ss!=null)n.setSelectionRange(ss,ss)}catch(e){}}}
  whoHtml();
  resolveNames();
}
function collectIds(){S.registre.forEach(e=>e.u&&needIds.add(e.u));S.fitxers.forEach(f=>{f.actualitzatPer&&needIds.add(f.actualitzatPer);(f.versions||[]).forEach(v=>v.per&&needIds.add(v.per));f.aprovatPer&&needIds.add(f.aprovatPer)})}
async function resolveNames(){
  if(!USER||!USER.profiles)return;collectIds();const ids=[...needIds];if(!ids.length)return;
  const ps=await USER.profiles(ids);let ch=false;
  for(const id of ids){const n=ps[id]&&ps[id].name||'';if(n&&NAMES[id]!==n){NAMES[id]=n;ch=true}}
  if(ch)schedule();
}

function route(){

  if(h.startsWith('doc-'))return{v:'documents',doc:h.slice(4)};
  return{v:(h in M||h==='documents'||h==='tauler')?h:'tauler'};
}

function bannerHtml(){

function cellVal(mk,c,r){

  if(f.tp==='money')return{h:fmtM(v),num:1};
  if(f.tp==='pct')return c==='avanc'?{h:progHtml(+v||0)}:{h:(v==null||v==='')?'—':fmtN(v)+'%',num:1};
  if(f.tp==='num')return{h:v==null||v===''?'—':['hores','quantitat'].includes(c)?fmtN(v):esc((+v).toLocaleString('ca-ES',{maximumFractionDigits:3,useGrouping:'always'})),num:1};

async function uploadFiles(fl,folder,intoId){
  if(!ASSETS){toast('No tens permís per pujar fitxers.');return}
  const [ow,carp]=folder.split('|');
  for(const file of fl){
    const ext=fext(file.name);const type=OKT[ext];
    if(!type){toast(`«${file.name}»: format no admès. Formats acceptats: PDF, imatges, vídeo MP4/WebM, CSV, TXT, JSON, MD.`);continue}
    if(file.size>20*1048576){toast(`«${file.name}» supera el límit de 20 MB.`);continue}
    toast(`Pujant ${file.name}…`);
    try{
      const r=await ASSETS.upload(file,{type});
      const ver={asset:r.id,nom:file.name,mida:r.sizeBytes,tipus:r.contentType,data:new Date().toISOString(),per:ME&&ME.id||null};
      let ex=intoId?S.fitxers.find(f=>f.id===intoId):S.fitxers.find(f=>!f.paperera&&f.owner===ow&&f.carpeta===carp&&f.nom===file.name);
      if(ex){const nv=[...(ex.versions||[]),ver];const {id,...rest}=ex;await save('fitxers',ex.id,{...rest,versions:nv});logA(`Nova versió v${nv.length} de ${ex.nom}`);toast(`${ex.nom}: desada la versió v${nv.length}.`);if(intoId)openDoc(intoId)}
      else{const id=newId('f');await save('fitxers',id,{nom:file.name,owner:ow,carpeta:carp,etiquetes:'',versions:[ver]});logA(`Pujat ${file.name} a ${ownerTxt(ow)} / ${carp}`);toast(`Pujat: ${file.name}`)}
    }catch(e){
      const c=e&&e.code;
      toast(c==='too_large'?`«${file.name}» és massa gran.`:c==='unsupported_type'?`«${file.name}»: format no admès.`:c==='quota_or_state'?"L'espai d'emmagatzematge és ple.":c==='rate_limited'?'Massa pujades seguides. Espera uns segons.':`No s'ha pogut pujar «${file.name}».`);
    }
  }
}

  else if(f.tp==='area')inp=`<textarea id="${id}" name="${f.k}" ${ro}>${esc(v)}</textarea>`;
  else{const t=f.tp==='date'?'date':['money','num','pct'].includes(f.tp)?'number':'text';
    inp=`<input id="${id}" name="${f.k}" type="${t}" ${t==='number'?`step="${f.tp==='money'?'0.01':'any'}" ${f.tp==='pct'?'min="0" max="100"':''}`:''} value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.req?'required':''} ${ro} ${f.tp==='code'?'class="mono"':''}>`}
  return `<div class="fld ${f.w?'w':''}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${inp}</div>`;
}
function openForm(mk,id,def){
  const m=M[mk];const r=id?S[mk].find(x=>x.id===id):null;if(id&&!r)return;
  const base=r?{...r}:{...def};
  if(!r){m.camps.forEach(f=>{if(base[f.k]==null){if(f.tp==='sel')base[f.k]=f.o[0];if(f.tp==='date'&&['data','inici'].includes(f.k))base[f.k]=today()}});
    if(m.pref)base[m.camps[0].k]=nextCode(mk);
    if(mk==='factures'){base.retencio=base.retencio??5}
    if(mk==='parts'){base.hores=8;base.preuHora=base.preuHora??24}}
  const body=`<form id="frm" data-mk="${mk}" data-id="${esc(id||'')}" class="fgrid" novalidate>${m.camps.map(f=>fieldHtml(f,base[f.k]??'')).join('')}</form>
   ${mk==='factures'?'<div class="calc" id="calc"></div>':''}
   ${mk==='factures'?'<div class="muted" style="font-size:12.5px">ISP: factures de subcontractistes d\'obra sense IVA repercutit (art. 84.U.2º.f LIVA). La retenció de garantia es descompta del total a cobrar o pagar.</div>':''}
   ${r&&r.exemple?'<div class="muted" style="font-size:12.5px">Aquest registre és una dada d\'exemple.</div>':''}
   ${r?`<div class="muted" style="font-size:12px">Darrera modificació: ${fmtDT(r.actualitzat)}</div>`:''}`;
  const foot=CANWRITE?`${r?`<button class="btn danger" data-act="del" data-mk="${mk}" data-id="${esc(id)}" id="delbtn">Elimina</button>`:''}<span class="sp"></span><button class="btn" data-act="close">Cancel·la</button><button class="btn pri" data-act="saveForm">${r?'Desa els canvis':'Crea '+m.s}</button>`:`<span class="sp"></span><button class="btn" data-act="close">Tanca</button>`;
  drawer(r?`${m.s[0].toUpperCase()+m.s.slice(1)}: ${r[m.tit]||r[m.camps[0].k]||''}`:`Nova ${m.s}`,body,foot);
  if(mk==='factures')calcF();
}
function readForm(){const fm=$('#frm');const mk=fm.dataset.mk;const o={};M[mk].camps.forEach(f=>{const el=fm.elements[f.k];if(!el)return;let v=el.value;if(['money','num','pct'].includes(f.tp))v=v===''?null:+v;o[f.k]=v});return{mk,id:fm.dataset.id,o}}
function calcF(){const c=$('#calc');if(!c)return;const {o}=readForm();const t=totF(o);c.innerHTML=`<span>Base imposable</span><b>${MF2.format(t.base)}</b><span>IVA ${String(o.iva).startsWith('ISP')?'(ISP, 0 €)':esc(o.iva)}</span><b>${MF2.format(t.iva)}</b><span>Retenció de garantia ${+o.retencio||0}%</span><b>−${MF2.format(t.ret)}</b><span style="font-weight:600">Total a ${o.sentit==='Rebuda'?'pagar':'cobrar'}</span><b>${MF2.format(t.total)}</b>`}
async function saveForm(){
  const {mk,id,o}=readForm();const m=M[mk];
  const miss=m.camps.filter(f=>f.req&&(o[f.k]==null||o[f.k]===''));
  if(miss.length){toast(`Falta omplir: ${miss.map(f=>f.l).join(', ')}.`);const el=$('#fld-'+miss[0].k);el&&el.focus();return}
  const prev=id?S[mk].find(x=>x.id===id):null;const nid=id||newId(mk.slice(0,2));
  const body={...(prev||{}),...o};delete body.id;
  try{await save(mk,nid,body)}catch(e){return}
  const lbl=o[m.tit]||o[m.camps[0].k]||m.s;
  if(!prev)logA(`Nova ${m.s}: ${lbl}`);else if(prev.estat!==o.estat&&o.estat)logA(`${m.s[0].toUpperCase()+m.s.slice(1)} «${lbl}» → ${o.estat}`);else logA(`Actualitzada ${m.s}: ${lbl}`);
  closeDrawer();toast(prev?'Canvis desats.':`${m.s[0].toUpperCase()+m.s.slice(1)} creada.`);
}
async function openDoc(id){
  const f=S.fitxers.find(x=>x.id===id);if(!f){toast("Aquest document no existeix o s'ha eliminat.");return}
  const v=curVer(f);
  const prev=v&&v.asset?`<div class="prev" style="min-height:80px">${ficon(f.nom)}<button class="btn sm pri" data-act="veuDoc" data-id="${esc(id)}">Veure el document</button></div>`:'<div class="prev muted" style="min-height:70px;padding:12px;text-align:center">Registre sense fitxer adjunt.</div>';
  const ro=CANWRITE&&!f.paperera?'':'disabled';
  const [o0]=[f.owner];
  const body=`${prev}
  <dl class="meta"><dt>Ubicació</dt><dd>${esc(ownerTxt(f.owner))} / ${esc(f.carpeta)}</dd><dt>Versió actual</dt><dd class="mono">v${(f.versions||[]).length||1} · ${fmtSize(v&&v.mida)}</dd></dl>
  <form id="dfrm" data-id="${esc(id)}" class="fgrid" novalidate>
   <div class="fld w"><label for="d-nom">Nom</label><input id="d-nom" name="nom" value="${esc(f.nom)}" ${ro}></div>
   <div class="fld"><label for="d-et">Etiquetes</label><input id="d-et" name="etiquetes" value="${esc(f.etiquetes||'')}" placeholder="p. ex. estructura, revisió B" ${ro}></div>
   <div class="fld"><label for="d-ow">Obra / àmbit</label><select id="d-ow" name="owner" ${ro}><option value="empresa" ${o0==='empresa'?'selected':''}>Empresa</option>${obraOpts(f.owner)}</select></div>
   <div class="fld"><label for="d-carp">Carpeta</label><select id="d-carp" name="carpeta" ${ro}>${(f.owner==='empresa'?CARP_EMP:CARP_OBRA).map(c=>`<option ${c===f.carpeta?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
  </form>
  <div><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><b style="flex:1">Historial de versions</b>
   ${ASSETS&&CANWRITE&&!f.paperera?`<label class="btn sm" for="upv">Puja versió nova</label><input type="file" id="upv" hidden data-upv="${esc(id)}">`:''}</div>
   <ul class="vers">${(f.versions||[]).map((x,i)=>({x,i})).reverse().map(({x,i})=>`<li><span class="pill ${i===f.versions.length-1?'t-ok':'t-neu'}">v${i+1}</span><div class="tx">${esc(x.nom)}<br><span class="muted" style="font-size:12px">${esc(nm(x.per))} · ${fmtDT(x.data)} · ${fmtSize(x.mida)}</span></div>${x.asset?`<button class="btn sm" data-act="veuDoc" data-id="${esc(id)}" data-i="${i}">Veure</button>`:''}</li>`).join('')||'<li class="muted">Sense versions.</li>'}</ul></div>
  <div class="muted" style="font-size:12.5px">Enllaç directe: mentre aquest document és obert, l'adreça de l'Obrador acaba en <span class="mono">#doc-${esc(id)}</span>. Comparteix-la amb qui ja tingui accés a l'Obrador.</div>`;
  const foot=!CANWRITE?`<span class="sp"></span><button class="btn" data-act="close">Tanca</button>`:f.paperera
   ?`${CANASSETADMIN||LOCAL?`<button class="btn danger" data-act="purge" data-id="${esc(id)}" id="purgebtn">Elimina definitivament</button>`:''}<span class="sp"></span><button class="btn pri" data-act="restore" data-id="${esc(id)}">Restaura</button>`
   :`<button class="btn danger" data-act="trash" data-id="${esc(id)}">A la paperera</button><span class="sp"></span><button class="btn" data-act="close">Cancel·la</button><button class="btn pri" data-act="saveDoc">Desa</button>`;
  drawer(f.nom,body,foot);
  if(location.hash!=='#doc-'+id)history.replaceState(null,'','#doc-'+id);
}
async function docUpdate(id,patch,msg){const f=S.fitxers.find(x=>x.id===id);if(!f)return;const {id:_,...rest}=f;try{await save('fitxers',id,{...rest,...patch})}catch(e){return}if(msg)logA(msg);}

/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,mk=a.dataset.mk,id=a.dataset.id;
  if(a.tagName==='A'&&act!=='goObra')return;
  switch(act){
    case'close':closeDrawer();break;
    case'new':openForm(mk,null,a.dataset.def?JSON.parse(a.dataset.def):{});break;
    case'edit':openForm(mk,id);break;
    case'goObra':V.obraTab='resum';location.hash='obra-'+id;break;
    case'otab':V.obraTab=a.dataset.v;paint();break;
    case'mode':mv(mk).mode=a.dataset.v;paint();break;
    case'saveForm':saveForm();break;
    case'folder':if(a.dataset.o)V.obraDocFolder[a.dataset.o]=a.dataset.k;else{V.docFolder=a.dataset.k;V.docQ=''}paint();break;
    case'openDoc':openDoc(id);break;
    case'del':if(!a.classList.contains('arm')){a.classList.add('arm');a.textContent='Confirma: elimina';setTimeout(()=>{if(a.isConnected){a.classList.remove('arm');a.textContent='Elimina'}},4000);break}
      {const r=S[mk].find(x=>x.id===id);try{await remove(mk,id)}catch(err){break}logA(`Eliminada ${M[mk].s}: ${r&&(r[M[mk].tit]||r[M[mk].camps[0].k])||''}`);closeDrawer();toast('Eliminat.');if(mk==='obres')location.hash='obres'}break;
    case'saveDoc':{const fm=$('#dfrm');const f=S.fitxers.find(x=>x.id===fm.dataset.id);const p={nom:fm.elements.nom.value.trim()||f.nom,etiquetes:fm.elements.etiquetes.value.trim(),owner:fm.elements.owner.value,carpeta:fm.elements.carpeta.value};

      await docUpdate(f.id,p,(f.owner!==p.owner||f.carpeta!==p.carpeta)?`Mogut ${p.nom} a ${ownerTxt(p.owner)} / ${p.carpeta}`:`Actualitzat ${p.nom}`);closeDrawer();toast('Document desat.');break}
    case'trash':{const f=S.fitxers.find(x=>x.id===id);await docUpdate(id,{paperera:true},`${f.nom} enviat a la paperera`);closeDrawer();toast('Enviat a la paperera. Es pot restaurar des de Paperera.');break}
    case'restore':{const f=S.fitxers.find(x=>x.id===id);await docUpdate(id,{paperera:false},`Restaurat ${f.nom}`);closeDrawer();toast('Document restaurat.');break}
    case'purge':if(!a.classList.contains('arm')){a.classList.add('arm');a.textContent='Confirma: no es pot desfer';setTimeout(()=>{if(a.isConnected){a.classList.remove('arm');a.textContent='Elimina definitivament'}},4000);break}
      {const f=S.fitxers.find(x=>x.id===id);try{if(ASSETS)for(const v of f.versions||[])if(v.asset)await ASSETS.delete(v.asset).catch(()=>{});await remove('fitxers',id)}catch(err){break}logA(`Eliminat definitivament ${f.nom}`);closeDrawer();toast('Document eliminat definitivament.');break}
    case'wipeEx':if(!a.classList.contains('arm')){a.classList.add('arm');a.textContent='Confirma: esborra els exemples';setTimeout(()=>{if(a.isConnected){a.classList.remove('arm');a.textContent="Esborra les dades d'exemple"}},4000);break}
      {a.disabled=true;let n=0;for(const c of COLS)for(const r of S[c].filter(x=>x.exemple)){try{await remove(c,r.id);n++}catch(err){}}
      if(!LOCAL){try{await DB.doc('registre/recent').set({entrades:S.registre.filter(x=>!x.exemple)})}catch(err){}}
      toast(`${n} registres d'exemple esborrats.`);break}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#drawerHost').innerHTML)closeDrawer();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act="folder"],tr[data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind==='q'){mv(t.dataset.mk).q=t.value;paint()}
  else if(t.dataset.bind==='docq'){V.docQ=t.value;paint()}
  if(t.closest('#frm')&&$('#calc'))calcF();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.bind==='obra'){mv(t.dataset.mk).obra=t.value;paint()}
  else if(t.dataset.bind==='estat'){mv(t.dataset.mk).estat=t.value;paint()}
  else if(t.dataset.up){uploadFiles([...t.files],t.dataset.up);t.value=''}
  else if(t.dataset.upv){const f=S.fitxers.find(x=>x.id===t.dataset.upv);uploadFiles([...t.files],folderKey(f.owner,f.carpeta),f.id);t.value=''}
  else if(t.id==='d-ow'){const c=$('#d-carp');const opts=t.value==='empresa'?CARP_EMP:CARP_OBRA;c.innerHTML=opts.map(x=>`<option>${esc(x)}</option>`).join('')}
  if(t.closest('#frm')&&$('#calc'))calcF();
});
document.addEventListener('submit',e=>{e.preventDefault()});
/* drag: kanban cards + file drop */
let dragId=null,dragMk=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){dragId=c.dataset.id;dragMk=c.dataset.mk;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}}});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');const dz=e.target.closest&&e.target.closest('[data-dropf]');
  if(col&&dragId){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')}
  if(dz&&e.dataTransfer.types.includes('Files')){e.preventDefault();dz.classList.add('over')}});
document.addEventListener('dragleave',e=>{const dz=e.target.closest&&e.target.closest('[data-dropf]');if(dz&&!dz.contains(e.relatedTarget))dz.classList.remove('over')});
document.addEventListener('drop',async e=>{
  const dz=e.target.closest&&e.target.closest('[data-dropf]');
  if(dz){e.preventDefault();dz.classList.remove('over');uploadFiles([...e.dataTransfer.files],dz.dataset.dropf);return}
  const col=e.target.closest&&e.target.closest('[data-drop]');document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'));
  if(col&&dragId){e.preventDefault();const r=S[dragMk].find(x=>x.id===dragId);const est=col.dataset.drop;const mk=dragMk;dragId=null;
    if(r&&r.estat!==est){const {id,...rest}=r;try{await save(mk,r.id,{...rest,estat:est});logA(`${M[mk].s[0].toUpperCase()+M[mk].s.slice(1)} «${r[M[mk].tit]||''}» → ${est}`)}catch(x){}}}
});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
window.addEventListener('hashchange',()=>{const r=route();if(r.v!=='documents'||!r.doc)closeDrawerSilently();paint();if(r.doc)openPending(r.doc);window.scrollTo(0,0)});
function closeDrawerSilently(){$('#drawerHost').innerHTML=''}
function openPending(id){const f=S.fitxers.find(x=>x.id===id);if(f){if(!f.paperera)V.docFolder=folderKey(f.owner,f.carpeta);paint();if(!$('#drawerHost').innerHTML)openDoc(id)}else V.pendingDoc=id}

/* ---------- Boot ---------- */
function goLocal(msg){LOCAL=true;LOCALMSG=msg;COLS.forEach(c=>loaded[c]=true);schedule()}
async function boot(){
  paint();
  const c=window.claude;
  if(!c||typeof c.use!=='function'){goLocal("Aquesta vista no té accés a la base de dades de l'Obrador: pots provar-lo, però els canvis no es desaran.");return}
  const [db,user,assets]=await Promise.all([c.use('db'),c.use('user'),c.use('assets')]);
  USER=user;ASSETS=assets;
  if(user){ME=await user.me();const cw=await user.can('data.write');CANWRITE=cw!==false;const aw=await user.can('assets.write');CANASSETADMIN=aw===true||(aw===null&&!!ME.canEdit)}
  if(!db){goLocal("Inicia sessió amb accés a aquest Obrador per veure i desar les dades de l'empresa. Ara els canvis no es desaran.");return}
  DB=db;
  const timer=setTimeout(()=>{STALE=true;COLS.forEach(k=>loaded[k]=true);schedule()},10000);
  let confirmed=0;
  const done=snap=>{if(!snap.metadata.fromCache&&++confirmed>=COLS.length){clearTimeout(timer);STALE=false}};
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>({...d.data(),id:d.id}));loaded[col]=true;done(snap);schedule();
      if(col==='fitxers'&&V.pendingDoc){const p=V.pendingDoc;V.pendingDoc=null;setTimeout(()=>openPending(p),0)}},
      err=>{loaded[col]=true;schedule();if(err&&err.code!=='revoked')toast('Algunes dades no es poden carregar ara mateix.')});
  });
  db.doc('registre/recent').onSnapshot(s=>{S.registre=(s.exists&&s.data().entrades)||[];schedule()},()=>{});
  const r=route();if(r.doc)V.pendingDoc=r.doc;
}
